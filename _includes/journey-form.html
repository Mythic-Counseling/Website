{%- comment -%} "Begin Your Mythic Journey" form section shared by the service pages. {%- endcomment -%}
<section class="section section--split section--light" aria-labelledby="journey-heading">
  <div class="container split split--reverse">
    <figure class="split__media">
      {% include picture.html name="olive-cairn-emblem" sizes="(min-width: 960px) 460px, 90vw" %}
    </figure>
    <div class="split__body">
      <h2 id="journey-heading">Begin Your Mythic Journey</h2>
      {% include contact-form.html google_form=site.forms.journey id="journey" submit="Submit" subject=page.title %}
    </div>
  </div>
</section>
