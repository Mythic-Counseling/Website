{%- assign services = site.services | sort: "order" -%}
<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <h2 class="site-footer__title">{{ site.title }}</h2>
      <p class="site-footer__email"><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    </div>
    <nav class="site-footer__nav" aria-label="Footer">
      <ul>
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/services/' | relative_url }}">{{ site.data.copy.services_page.heading }}</a></li>
        {%- for s in services %}
        <li><a href="{{ s.url | relative_url }}">{{ s.title }}</a></li>
        {%- endfor %}
        <li><a href="{{ '/about/' | relative_url }}">About</a></li>
        <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
      </ul>
    </nav>
  </div>
  <p class="site-footer__legal">&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
</footer>
