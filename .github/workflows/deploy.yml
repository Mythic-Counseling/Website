# Builds and publishes the site to GitHub Pages on every push to main
# (including saves from Pages CMS), and once a day so posts dated in the future
# appear on their date. Uploaded images are compressed on the way.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC, early morning in Florida
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compress uploaded images
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick pngquant
          theme/scripts/compress-uploads.sh
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
