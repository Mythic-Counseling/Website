# Practice details, booking and forms. See docs/2-booking-and-forms.md for
# how to get each link.

email: "evan@mythic-counseling.com"
region: "Florida"
tagline: "Holistic, Humanistic Wellness, Tailored to Fit Your Needs"
# The summary search engines and link previews show for the site as a whole.
description: "Holistic, humanistic counseling in Florida: a person-centered, non-pathologizing alternative to mental health care. Free 30 minute consultation, individual counseling, group counseling and Intentional Peer Support training."

# Online booking. Every "Book now" button opens the booking dialog.
# Paste each Google Calendar appointment schedule's embed link: Share →
# Website embed → Inline booking page, then copy only the src="…" value
# (https://calendar.google.com/calendar/appointments/schedules/…?gv=true).
# While both are empty, the dialog shows the Acuity scheduler below instead.
booking:
  google:
    consultation: ""   # Free Initial 30 Minute Consultation
    individual: ""     # 60 Minute Individual Counseling Sessions
  acuity_url: "https://mythiccounselingofflorida.as.me/?calendarID=14740761"
  acuity_embed_url: "https://app.acuityscheduling.com/schedule.php?owner=40782217&calendarID=14740761"

# Contact form. Paste the Google Form's *pre-filled* link, made with the
# answers FIRST, LAST, EMAIL and MESSAGE (docs/2-booking-and-forms.md, step 3):
# the site's own form then sends each message into that Google Form, and Google
# emails you. A plain form link embeds Google's form instead. While it is
# empty, the form opens the visitor's email app addressed to `email`.
forms:
  contact: ""

# Email newsletter. From your newsletter service's embedded signup form, copy
# the form's action="…" URL and the name="…" of its email field; add any
# hidden inputs it includes. See docs/4-newsletter.md. While `action` is
# empty, the signup forms and the Newsletter link stay hidden.
newsletter:
  action: ""
  email_field: "email"
  hidden_fields: []   # e.g. - { name: "tag", value: "website" }
