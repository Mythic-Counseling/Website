# Technical settings for Mythic Counseling of Florida. You should rarely need
# to change this file: the practice's details are in content/_data/settings.yml.
# Changes here only take effect after restarting a local preview.
#
# Deployment: `url` is the public origin used for canonical links, the sitemap,
# Open Graph tags and structured data. `baseurl` is the sub-path the site is
# served from.
#   - Custom domain (recommended):  url: "https://mythic-counseling.com", baseurl: ""
#   - GitHub project page:          url: "https://<user>.github.io",      baseurl: "/<repo-name>"
url: "https://mythic-counseling.com"
baseurl: ""

title: "Mythic Counseling of Florida"
lang: en-US
timezone: America/New_York
locale: en_US
default_image: /assets/images/og-mythic-counseling.jpg

# Email, booking calendars, forms, tagline and search description are in
# content/_data/settings.yml.

permalink: pretty
markdown: kramdown

# Folders. Everything you write is in content/ (see README.md); the design and
# page templates are in theme/.
collections_dir: content
data_dir: content/_data
layouts_dir: theme/_layouts
includes_dir: theme/_includes

# In services and specialties, text above a <!--more--> line is the short
# summary shown on cards; the rest is revealed with "Read more".
excerpt_separator: "<!--more-->"
collections:
  services:
    output: true
    permalink: /services/:name/
  specialties:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: services
    values:
      layout: service
      body_class: service
      hero_image: misty-mountain-river
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      body_class: post
      permalink: /blog/:title/

exclude:
  - .pages.yml
  - README.md
  - docs/
  - Gemfile
  - Gemfile.lock
  - theme/scripts/
  - assets/images/original/
  - vendor/
  - .bundle/
