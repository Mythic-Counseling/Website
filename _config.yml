# Site settings for Mythic Counseling of Florida.
#
# Deployment: `url` is the public origin used for canonical links, the sitemap,
# Open Graph tags and structured data. `baseurl` is the sub-path the site is
# served from.
#   - Custom domain (recommended):  url: "https://mythic-counseling.com", baseurl: ""
#   - GitHub project page:          url: "https://<user>.github.io",      baseurl: "/<repo-name>"
# Currently: the GitHub Pages preview. When the domain is pointed at GitHub
# (docs/1-put-the-site-on-github.md, step 6), switch back to:
#   url: "https://mythic-counseling.com"
#   baseurl: ""
url: "https://mythic-counseling.github.io"
baseurl: "/Website"

title: "Mythic Counseling of Florida"
tagline: "Holistic, Humanistic Wellness, Tailored to Fit Your Needs"
description: "Holistic, humanistic counseling in Florida: a person-centered, non-pathologizing alternative to mental health care. Free 30 minute consultation, individual counseling, group counseling and Intentional Peer Support training."
lang: en-US
locale: en_US

email: "evan@mythic-counseling.com"
region: "Florida"
default_image: /assets/images/og-mythic-counseling.jpg

# Online scheduling. Every "Book" button links to /appointments/.
# Google Calendar appointment schedules: paste the URL from each schedule's
# Share → Website embed → Inline booking page code (the src="…" value, which
# looks like https://calendar.google.com/calendar/appointments/schedules/…?gv=true).
# See docs/2-booking-and-forms.md. While both are empty, the Appointments
# page falls back to the Acuity scheduler below.
booking:
  google:
    consultation: ""   # Free Initial 30 Minute Consultation
    individual: ""     # 60 Minute Individual Counseling Sessions
  acuity_url: "https://mythiccounselingofflorida.as.me/?calendarID=14740761"
  acuity_embed_url: "https://app.acuityscheduling.com/schedule.php?owner=40782217&calendarID=14740761"

# Google Forms. Paste each form's "viewform" link (Send → link icon).
# `contact` replaces the Contact page form and `journey` the "Begin Your Mythic
# Journey" form on the service pages (they can be the same form). While a link
# is empty, that form falls back to opening the visitor's email app addressed
# to `email`.
forms:
  contact: ""
  journey: ""
  ips_training: "https://docs.google.com/forms/d/e/1FAIpQLSfJbXN4H5pAM3Z-CP7NRwNLcC3HfK3nKOdQ9SN5D31nme1ANg/viewform?usp=dialog"
  group_counseling: "https://docs.google.com/forms/d/e/1FAIpQLSfuu8bHm49I2RhLA8yUZkRlmjL3u26UOo9Fa6mnnK7b1KzI_A/viewform?usp=dialog"

permalink: pretty
markdown: kramdown

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - docs/
  - Gemfile
  - Gemfile.lock
  - scripts/
  - reference/
  - assets/images/original/
  - vendor/
  - .bundle/
