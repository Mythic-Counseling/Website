# Responsive image catalogue, consumed by _includes/picture.html.
# Masters live in assets/images/original/; derived files are produced by
# scripts/optimize-images.sh. `widths` lists the generated WebP widths and
# `fallback` the width of the PNG served to browsers without WebP support.

misty-mountain-river:
  width: 1536
  height: 1024
  widths: [640, 1024, 1536]
  fallback: 1024
  alt: "Sepia illustration of a misty mountain range and river beneath a rising sun"

