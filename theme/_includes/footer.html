<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <h2 class="site-footer__title">{{ site.title }}</h2>
      <p class="site-footer__email"><a href="mailto:{{ site.data.settings.email }}">{{ site.data.settings.email }}</a></p>
    </div>
    <nav class="site-footer__nav" aria-label="Footer">
      <ul>
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        {%- for item in site.data.navigation %}
        {%- if item.requires == "posts" and site.posts.size == 0 %}{% continue %}{% endif %}
        <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
  <p class="site-footer__legal">&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
</footer>
